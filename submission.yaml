submission:
  title: "AI Emergency Operations & Resource Orchestration System"

  problem_statement: >
    Disaster response operations must combine fragmented, uncertain, and sometimes
    conflicting information from field teams, imagery, infrastructure systems, hospitals,
    and sensors. Without evidence fusion, accessibility analysis, and resource optimization,
    critical decisions can be delayed and limited emergency resources can be misallocated.

  solution_summary: >
    We built an evidence-aware operational decision engine for disaster response. The system
    fuses multi-source observations with freshness decay and conflict detection, computes
    graph-based route accessibility with simulated road and bridge status changes, performs
    constrained resource allocation, and provides natural-language operational Q&A through
    IBM Bob MCP tools — all backed by a deterministic discrete-event simulation of a
    synthetic Bhote Valley flood scenario.

  key_features:
    - "Multi-source evidence fusion with weighted freshness decay and explicit conflict detection (source_reliability × confidence × exp(-λ × age))"
    - "Dynamic NetworkX road/bridge graph with simulated status updates, blocked-route exclusion, and automatic alternate path calculation"
    - "Constrained resource optimizer using greedy allocation plus local improvement, with capability matching and measurable improvement over a nearest-resource baseline"
    - "14 IBM Bob MCP tools backed by live backend state, including situation, evidence, routing, simulation, decision explanation, and benchmark operations"
    - "64-test suite, deterministic synthetic Bhote Valley scenario, and reproducible benchmark comparing the orchestration engine against baseline strategies"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite", "Pydantic v2", "SQLAlchemy", "NetworkX"]
    ibm_technologies:
      - "IBM Bob (MCP integration — 14 operational tools)"
      - "IBM watsonx.ai (optional — ibm/granite-3-8b-instruct)"
    databases: ["SQLite (aiosqlite, local demo)", "PostgreSQL-ready (configurable)"]
    other: ["Leaflet", "React-Leaflet", "pytest", "httpx", "uvicorn"]

  what_we_are_most_proud_of: >
    The evidence fusion and conflict detection engine. When Bridge B1 receives two
    contradictory field reports, the system surfaces the conflict using source reliability,
    freshness, confidence, and provenance, and recommends human verification rather than
    silently choosing one source. Uncertainty is treated as a first-class part of the
    operational state. Combined with 14 load-bearing IBM Bob MCP tools that return actual
    backend algorithmic results rather than hardcoded responses, the system demonstrates
    an explainable and measurable approach to disaster-response decision support.

  known_limitations: >
    The prototype uses a deterministic synthetic Bhote Valley flood scenario and does not
    ingest real-time external disaster data. Map tiles require internet connectivity.
    Resource optimization uses greedy allocation plus local improvement rather than a full
    ILP/MILP solver. The watsonx.ai LLM integration is optional and the system remains
    functional without it. The prototype is a decision-support system and does not
    autonomously direct real-world emergency operations.

